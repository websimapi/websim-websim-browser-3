<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websim Browser</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="browser-window">
        <header id="browser-chrome">
            <div class="nav-buttons">
                <button id="back-btn" title="Back"><i class="fa fa-arrow-left"></i></button>
                <button id="forward-btn" title="Forward"><i class="fa fa-arrow-right"></i></button>
                <button id="refresh-btn" title="Refresh"><i class="fa fa-redo"></i></button>
            </div>
            <div class="address-bar-container">
                <i class="fa fa-lock lock-icon"></i>
                <input type="text" id="address-bar" value="websim://home">
            </div>
        </header>
        <main id="content-area">
            <!-- Use a webview for better isolation than an iframe -->
            <webview id="content-view" src="websim_home.html" style="width:100%; height:100%; border:none;"></webview>
        </main>
    </div>
    <div id="error-modal" class="hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Navigation Blocked</h2>
            <p>This browser is restricted to <strong>websim://</strong> pages only.</p>
            <p>You attempted to navigate to: <code id="blocked-url"></code></p>
        </div>
    </div>
    <script src="renderer.js"></script>

</body>
</html>
